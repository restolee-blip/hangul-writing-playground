<script id="stroke-model">
const loop=Array.from({length:17},(_,i)=>i===16?[.5,0]:[.5-.5*Math.sin(i*Math.PI/8),.5-.5*Math.cos(i*Math.PI/8)]);
const scale=(paths,x,y,w,h)=>paths.map(path=>path.map(([u,v])=>[x+u*w,y+v*h]));
const models={
 'ㄱ':[[[0,0],[1,0],[1,1]]], 'ㄴ':[[[0,0],[0,1],[1,1]]],
 'ㄷ':[[[0,0],[1,0]],[[0,0],[0,1],[1,1]]],
 'ㄹ':[[[0,0],[1,0],[1,.5]],[[0,.5],[1,.5]],[[0,.5],[0,1],[1,1]]],

 'ㅂ':[[[0,0],[0,1]],[[1,0],[1,1]],[[0,.48],[1,.48]],[[0,1],[1,1]]],

 'ㅈ':[[[0,0],[.92,0],[0,1]],[[.56,.39],[1,1]]],
 'ㅊ':[[[.48,0],[.48,.20]],[[0,.30],[.92,.30],[0,1]],[[.55,.58],[1,1]]],
 'ㅋ':[[[0,0],[1,0],[1,1]],[[0,.48],[1,.48]]],
 'ㅌ':[[[0,0],[1,0]],[[0,.48],[1,.48]],[[0,0],[0,1],[1,1]]],
 'ㅍ':[[[0,0],[1,0]],[[.25,0],[.25,1]],[[.75,0],[.75,1]],[[0,1],[1,1]]],
 'ㅎ':[[[.48,0],[.48,.18]],[[0,.31],[1,.31]],...scale([loop],.15,.46,.70,.54)],
 'ㅏ':[[[0,0],[0,1]],[[0,.49],[1,.49]]],
 'ㅑ':[[[0,0],[0,1]],[[0,.34],[1,.34]],[[0,.65],[1,.65]]],
 'ㅓ':[[[0,.49],[1,.49]],[[1,0],[1,1]]],
 'ㅕ':[[[0,.34],[1,.34]],[[0,.65],[1,.65]],[[1,0],[1,1]]],
 'ㅗ':[[[.5,0],[.5,1]],[[0,1],[1,1]]],
 'ㅛ':[[[.33,0],[.33,1]],[[.66,0],[.66,1]],[[0,1],[1,1]]],
 'ㅜ':[[[0,0],[1,0]],[[.5,0],[.5,1]]],
 'ㅠ':[[[0,0],[1,0]],[[.33,0],[.33,1]],[[.66,0],[.66,1]]],

};
const consonants=[...'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ'], vowels=[...'ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ'];
const leads=[...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
const mids=[...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
const tails=['',...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
const pairs={'ㄲ':'ㄱㄱ','ㄸ':'ㄷㄷ','ㅃ':'ㅂㅂ','ㅆ':'ㅅㅅ','ㅉ':'ㅈㅈ','ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
for(const [k,[a,b]] of Object.entries(pairs))models[k]=[...scale(models[a],0,0,.43,1),...scale(models[b],.57,0,.43,1)];
for(const [k,a] of Object.entries({'ㅐ':'ㅏ','ㅒ':'ㅑ','ㅔ':'ㅓ','ㅖ':'ㅕ'}))models[k]=[...scale(models[a],0,0,.72,1),[[1,0],[1,1]]];
const mixed={'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};
for(const [k,[a,b]] of Object.entries(mixed))models[k]=[...scale(models[a],0,.55,.57,.42),...scale(models[b],.68,0,.32,1)];
const names=Object.fromEntries(consonants.map((c,i)=>[c,'기역 니은 디귿 리을 미음 비읍 시옷 이응 지읒 치읓 키읔 티읕 피읖 히읗'.split(' ')[i]]));
mids.forEach((c,i)=>names[c]=String.fromCharCode(0xac00+11*588+i*28));
const layouts={
 '가': [['ㄱ',52,104,106,105],['ㅏ',220,65,77,190]],
 '간': [['ㄱ',53,77,102,91],['ㅏ',218,52,73,145],['ㄴ',83,240,198,66]],

};
function splitSyllable(letter){
 const n=letter.charCodeAt(0)-0xac00;
 return n>=0&&n<11172?[leads[Math.floor(n/588)],mids[Math.floor(n%588/28)],tails[n%28]]:null;

function strokesFor(letter){
 const jamo=splitSyllable(letter);
 let parts=layouts[letter];
 if(!parts&&jamo){
  const [a,b,c]=jamo, top=c?156:251;

  else if('ㅗㅛㅜㅠㅡ'.includes(b))parts=[[a,91,40,178,top*.49],[b,54,58+top*.52,252,top*.39]];

  if(c)parts.push([c,84,234,192,76]);
 }else if(!parts)parts=[[letter,...(letter==='ㅏ'?[140,56,113,248]:[77,78,206,202])]];
 return parts.flatMap(([j,x,y,w,h],part)=>scale(models[j],x,y,w,h).map(points=>({part,jamo:j,points})));
}
const distance = (a,b) => Math.hypot(a[0]-b[0],a[1]-b[1]);
const mix = (a,b,t) => a.map((v,i)=>v+(b[i]-v)*t);
function sample(points,step=6){
  const output=[points[0]];
  for(let i=1;i<points.length;i++){
    const count=Math.max(1,Math.ceil(distance(points[i-1],points[i])/step));
    for(let j=1;j<=count;j++)output.push(mix(points[i-1],points[i],j/count));
  }
  return output;
}
function judge(ink,target,difficulty='normal'){
  const path=sample(target), input=sample(ink);
  const total=target.slice(1).reduce((sum,p,i)=>sum+distance(p,target[i]),0);
  const base={easy:34,normal:27,precise:21}[difficulty];
  const start=Math.min(base,total*.34), width=Math.min(base,total*.42);
  if(distance(input[0],target[0])>start)return 'start';
  if(input.length<4||distance(input.at(-1),target.at(-1))>Math.min(base,total*.28))return 'finish';
  const closed=distance(target[0],target.at(-1))<1;
  let progress=0, outside=0, backwards=0;
  for(let k=0;k<input.length;k++){
    const p=input[k];
    let closest=0, error=Infinity;
    path.forEach((q,i)=>{
      if(closed && ((k/input.length<.45&&i/path.length>.85)||(k/input.length>.55&&i/path.length<.15)))return;
      const d=distance(p,q);if(d<error){error=d;closest=i}
    });
    if(error>width)outside++;
    if(closest<progress-Math.max(2,Math.floor(path.length*.12)))backwards++;
    progress=Math.max(progress,closest);
  }
  if(backwards/input.length>.12)return 'direction';
  if(outside/input.length>.15)return 'path';
  const corners=closed?[]:target.slice(1,-1);
  const checks=closed?[.23,.48,.73,.91].map(f=>path[Math.floor(f*(path.length-1))]):
    [...target.slice(1).flatMap((p,i)=>[mix(target[i],p,.5),...(i<corners.length?[p]:[])])];
  let from=0;
  for(const point of checks){
    const index=input.findIndex((p,k)=>k>=from&&distance(p,point)<=Math.min(width*.85,total*.20));
    if(index<0)return 'path';
    from=index+1;
  }
  return 'ok';
}

 $('home').onclick=home;

 });

function instruction(s){
  const pts=s.points, first=pts[0], second=pts[1];
  if(pts.length>8)return "왼쪽으로 둥글게 돌아요.";
  const direction=(a,b)=>Math.abs(b[0]-a[0])>Math.abs(b[1]-a[1])?(b[0]>a[0]?'오른쪽으로':'왼쪽으로'):(b[1]>a[1]?'아래로':'위로');
  return pts.length>2?direction(first,second)+' 쭉, 꺾어서 '+direction(second,pts[2])+' 쭉!':direction(first,second)+' 쭉!';
}
function overviewSection(group,items){
 const cards=items.map((item,i)=>'<button class="card" data-overview="'+group.id+'" data-index="'+i+'">'+(item.image?'<img alt="" src="'+item.image+'">':'')+h(item.text)+'</button>').join('');
 return '<section class="overview-section"><h2>'+group.title+'</h2><div class="overview-grid'+(group.id==='words'?' word-grid':'')+'">'+cards+'</div>'+(!items.length?'<p>아직 고를 수 있는 항목이 없어요.</p>':'')+'</section>';
}

 app.querySelectorAll('[data-overview]').forEach(button=>button.onclick=()=>{

  const item=rows(group)[+button.dataset.index];

 });
}

  bindGroups();$('learn')?.addEventListener('click',()=>{screen='learn';render()});
  $('resume')?.addEventListener('click',resume);

  $('teacher').onclick=teacherLogin;
  $('saveComputer').onclick=saveComputerCopy;
  return;
 }
 if(screen==='learn'){

  bindOverview();bindGroups();$('home').onclick=home;return;
 }
 if(screen==='choose'){
  const group=groups.find(g=>g.id===choosing), list=rows(choosing);

   app.innerHTML='<section class="home"><h1>하나를 골라요</h1><div class="overview">'+overviewSection(group,list)+'</div><div class="homefoot"><button id="home">처음으로</button>'+(choosing==='words'&&list.length?'<button id="randomWord">랜덤 단어 쓰기</button>':'')+'</div></section>';
   bindOverview();$('home').onclick=home;$('randomWord')?.addEventListener('click',()=>randomWord());return;
  }

  const set=list.slice(page*4,page*4+4);
  app.innerHTML='<section class="home"><p class="eyebrow">하나를 골라요</p><h1>'+group.title+'</h1><div class="choices letters">'+set.map((row,i)=>'<button class="card" data-letter="'+i+'">'+(row.image?'<img alt="" src="'+row.image+'">':'')+h(row.text)+'</button>').join('')+'</div>'+(!list.length?'<p>선생님이 낱말을 넣어 주면 써 볼 수 있어요.</p>':'')+'<div class="homefoot"><button id="home">처음으로</button>'+(page>0?'<button id="backPage">앞 카드</button>':'')+((page+1)*4<list.length?'<button id="nextPage">더 보기</button>':'')+'</div></section>';
  app.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>enter(choosing,set[+b.dataset.letter]));
  $('home').onclick=home;$('backPage')?.addEventListener('click',()=>choose(choosing,page-1));$('nextPage')?.addEventListener('click',()=>choose(choosing,page+1));return;
 }
  app.innerHTML='<div class="work"><section class="sheet"><div class="top"><button id="home" aria-label="처음으로">'+icon('home')+'</button><span class="title">'+(state.image?'<img class="writing-picture" src="'+state.image+'" alt="">':'')+h(letter())+' 쓰기</span><button id="sound" class="sound" aria-label="글자와 안내 듣기">'+icon('sound')+'</button></div><svg id="board" class="board" viewBox="0 0 360 360" role="img" aria-label="글자 쓰기 칸"></svg><div id="status" class="status" role="status"></div><button id="next" class="complete-next" hidden>다음 글자</button><div id="wordstrip" class="wordstrip"></div></section><aside class="controls"><div class="mode"><button id="trace" aria-pressed="'+(state.mode==='trace')+'">따라 쓰기</button><button id="free" aria-pressed="'+(state.mode==='free')+'">혼자 쓰기</button></div><div class="tools"><button id="play">'+icon('play')+'다시 보기</button><button id="undo">'+icon('undo')+'한 획 지우기</button><button id="reset">'+icon('reset')+'다시 쓰기</button><button id="hint" class="hint">'+icon('hint')+'힌트 보기</button></div><div class="nav"><button id="prev">이전 글자</button><button id="allWords"'+(state.group==='words'?'':' hidden')+'>단어 모두 보기</button></div><div class="nav"><button id="guided" hidden>시범과 함께</button><button id="png" hidden>작품 저장</button></div><p id="saveStatus" class="sub"></p></aside></div>';
  const by=id=>document.getElementById(id);
  by('home').onclick=home;
  by('sound').onclick=()=>speak((names[letter()]??letter())+'. '+statusText());
  by('play').onclick=()=>animate(complete()?0:state.ink.length,complete());
  by('hint').onclick=()=>{if(!complete()){showHint=true;animate(state.ink.length)}};
  by('undo').onclick=()=>{stop();state.ink.pop();failed=0;showHint=false;message='';persist();paint()};
  by('reset').onclick=()=>{stop();state.ink=[];state.attempts=0;failed=0;showHint=false;message='';persist();paint()};
  by('prev').onclick=()=>{
   if(state.index>0)step(state.index-1);
   else {const list=rows(state.group), i=list.findIndex(x=>x.id===state.id);if(i>0)enter(state.group,list[i-1])}
  };
  by('next').onclick=advance;
  by('allWords').onclick=()=>choose('words');
  for(const mode of ['trace','free'])by(mode).onclick=()=>{stop();state.mode=mode;showHint=false;message='';persist();render();scheduleNext()};
  by('guided').onclick=()=>{if(!complete())animate(state.ink.length,true,true)};
  by('png').onclick=saveArtwork;
  wire(by('board'));paint();
}
function statusText(){
  if(message)return message;
  if(complete()){
    const last=state.index===lettersOf(state.text).length-1;
    const guided=state.ink.some(x=>x.guided)||(last&&Object.values(state.done).some(d=>d.ink.some(x=>x.guided)));
    return guided?'시범과 함께 완성했어요!':last&&lettersOf(state.text).length>1?state.text+' 완성!':'완성했어요!';
  }
  const index=state.ink.length, s=strokes()[index], prev=strokes()[index-1];
  if(s.part===2&&prev?.part!==2)return '아래에 받침을 써요.';
  if(s.part===1&&prev?.part!==1)return '이제 모음을 써요.';
  return (state.mode==='free'||!db.settings.start)&&!showHint?'어디서 시작할까요?':'노란 점에서 시작해요.';
}
const poly=(pts,color,w,more='')=>'<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" '+more+'/>';
function paint(){
  const all=strokes(),index=state.ink.length, current=all[index], board=document.getElementById('board');
  let out='<path d="M180 16v328M16 180h328" stroke="#e4edf2" stroke-dasharray="5 7"/>';
  if(current?.part===2)out+='<rect x="29" y="215" width="302" height="120" rx="18" fill="#eff7df" stroke="#a4c88d" stroke-dasharray="5 5"/>';
  if((state.mode==='trace'&&db.settings.lines)||showHint)out+=all.map(s=>poly(s.points,'#dae6ef',15)).join('');
  if(current&&((state.mode==='trace'&&db.settings.lines)||showHint))out+=poly(current.points,'#9fc8f3',showHint?25:16);
  out+=state.ink.map(x=>poly(x.points,x.guided?'#7967a3':'#235777',10)).join('');

function animate(index,through=false,guide=false){
  stop();const token=demoToken, all=strokes();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches&&guide){
    for(const s of all.slice(index))state.ink.push({points:s.points,guided:true});
    message='';logCompletion();persist();paint();scheduleNext();return;
  }
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    showHint=true;message=instruction(all[index]);speak(message);paint();return;
  }
  function run(i){
    const s=all[i], path=sample(s.points,3), start=performance.now(), duration=Math.min(1100,420+path.length*8)/db.settings.speed;
    message=instruction(s);speak(message);
    function frame(now){
      if(token!==demoToken)return;
      const n=Math.min(path.length,Math.max(2,Math.ceil((now-start)/duration*path.length)));
      demo=path.slice(0,n);paint();
      if(n<path.length){requestAnimationFrame(frame);return}
      timer=setTimeout(()=>{
        if(token!==demoToken)return;
        demo=null;message='';
        if(guide){state.ink.push({points:s.points,guided:true});logCompletion();persist()}
        if(through&&i+1<all.length)run(i+1);else{paint();if(guide)scheduleNext()}
      },240);
    }
    requestAnimationFrame(frame);
  }
  run(index);
}
function wire(board){
  function xy(e){const rect=board.getBoundingClientRect();return [(e.clientX-rect.left-board.clientLeft)*360/board.clientWidth,(e.clientY-rect.top-board.clientTop)*360/board.clientHeight]}
  board.addEventListener('pointerdown',e=>{
    if(active!==null||complete()||e.button!==0||!e.isPrimary)return;
    e.preventDefault();stop();active=e.pointerId;draft=[xy(e)];message='';
    board.setPointerCapture(e.pointerId);paint();
  });
  board.addEventListener('pointermove',e=>{
    if(e.pointerId!==active)return;
    const events=e.getCoalescedEvents?.();
    for(const move of events?.length?events:[e]){
      const point=xy(move);
      if(distance(draft.at(-1),point)>=1&&draft.length<4000)draft.push(point);
    }
    paint();
  });
  board.addEventListener('pointerup',e=>{
    if(e.pointerId!==active)return;
    draft.push(xy(e));const ink=draft;draft=[];active=null;
    const result=judge(ink,strokes()[state.ink.length].points,state.difficulty);
    if(result==='ok'){
      state.ink.push({points:ink.filter((_,i)=>i%2===0||i===ink.length-1),guided:false});failed=0;showHint=false;logCompletion();persist();scheduleNext();
      if(complete())speak(state.index===lettersOf(state.text).length-1?state.text+'. 완성했어요!':'잘 썼어요!');
      else if(strokes()[state.ink.length].part===2&&strokes()[state.ink.length-1].part!==2)speak('아래에 받침을 써요.');
    }else{
      failed++;state.attempts++;persist();showHint=failed>=2;
      message={start:'시작점을 찾아 다시 써요.',finish:'끝까지 쭉 써 볼까요?',direction:'화살표를 따라가요.',path:'길을 따라 다시 써요.'}[result];
      speak(message);
      if(failed===3){animate(state.ink.length);return}
    }
    paint();
  });
  const cancel=e=>{if(e.pointerId===active){active=null;draft=[];paint()}};
  board.addEventListener('pointercancel',cancel);board.addEventListener('lostpointercapture',cancel);
}

function loadPicture(file){

  if(file.size>12*1024*1024){reject();return}
  const image=new Image(),url=URL.createObjectURL(file);
  image.onerror=()=>{URL.revokeObjectURL(url);reject()};
  image.onload=()=>{
   URL.revokeObjectURL(url);
   try{
    const canvas=document.createElement('canvas'), ratio=Math.min(1,320/Math.max(image.width,image.height));
    canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/webp',.8));
   }catch{reject()}
  };
  image.src=url;
 });
}

function pathsPanel(text){
 const l=text||'간',base=strokesFor(l),data=db.paths[l]??base.map(s=>s.points);
 $('panel').innerHTML='<h2>획순 자료 확인</h2><p>기본 획순을 조합한 경로입니다. 아래 좌표를 수정하면 이 글자의 연습에 적용됩니다.</p><form id="pathPick"><label>한 글자 <input id="glyph" maxlength="1" value="'+h(l)+'"></label><button>조회</button></form><div class="preview">'+previewLetters(l)+'</div><ol>'+base.map((s,i)=>'<li>'+h((i+1)+'획 · '+s.jamo+' · '+instruction(s))+'</li>').join('')+'</ol><button id="playPath">획순 시범 보기</button><svg id="teacherBoard" viewBox="0 0 360 360" width="150" height="150" aria-label="획순 시범"></svg><details><summary>경로 직접 편집</summary><label>획별 좌표 JSON<br><textarea id="coords" rows="7" cols="48">'+h(JSON.stringify(data))+'</textarea></label><div class="toolbar"><button id="savePath">경로 적용</button><button id="clearPath">기본 경로 복원</button></div></details>';
 $('playPath').onclick=()=>{
  const view=$('teacherBoard');view.replaceChildren();const drawn=[];let i=0;
  function animateTeacher(){
   if(!view.isConnected||i>=data.length)return;
   const n=i++, path=sample(data[n],3),start=performance.now();
   function frame(now){
    if(!view.isConnected)return;
    const count=Math.min(path.length,Math.max(1,Math.ceil((now-start)*path.length/650)));
    view.innerHTML=drawn.join('')+poly(path.slice(0,count),'#22619f',12);
    if(count<path.length)requestAnimationFrame(frame);
    else{drawn.push(poly(data[n],'#415e79',12));setTimeout(animateTeacher,180)}
   }
   requestAnimationFrame(frame);
  }
  $('playPath').disabled=true;animateTeacher();setTimeout(()=>{if(view.isConnected)$('playPath').disabled=false},data.length*900);
 };
 $('pathPick').onsubmit=e=>{e.preventDefault();const value=$('glyph').value.trim();if(value.length!==1||(!models[value]&&!splitSyllable(value))){feedback('한글 한 글자를 입력해 주세요.');return}teacher('paths',value)};
 $('savePath').onclick=()=>{
  let value;try{value=JSON.parse($('coords').value)}catch{}
  if(!validPath(value,base.length)){feedback('획 수와 각 좌표를 확인해 주세요. 좌표는 0~360입니다.');return}
  commit(()=>{db.paths[l]=value},()=>teacher('paths',l,'수정 경로를 적용했어요.'));
 };
 $('clearPath').onclick=()=>commit(()=>{delete db.paths[l]},()=>teacher('paths',l,'기본 경로를 복원했어요.'));
}
function validBackup(x){
 if(!x||x.version!==2||!Array.isArray(x.profiles)||!Array.isArray(x.records)||!Array.isArray(x.hidden)||!x.settings||!x.catalog||!x.sessions||!x.paths)return false;
 const id=v=>typeof v==='string'&&/^[a-zA-Z0-9-]{1,90}$/.test(v);
 const groupIds=groups.map(g=>g.id);
 const ids=new Set(['guest']);
 for(const p of x.profiles){
  if(!p||!id(p.id)||ids.has(p.id)||typeof p.name!=='string'||!canWrite(p.name)||!avatars.includes(p.avatar)||typeof p.hidden!=='boolean')return false;
  ids.add(p.id);
 }
 if(!ids.has(x.active)||typeof x.pin!=='string'||!/^([0-9]{4})?$/.test(x.pin)||x.hidden.some(g=>!groupIds.includes(g)))return false;
 const st=x.settings;
 if(!['easy','normal','precise'].includes(st.difficulty)||!['free','trace'].includes(st.stage)||![.65,1,1.35].includes(st.speed)||['voice','auto','numbers','arrows','start','lines','repeat'].some(k=>typeof st[k]!=='boolean'))return false;
 for(const g of groupIds.filter(g=>g!=='name')){
  if(!Array.isArray(x.catalog[g])||x.catalog[g].some(r=>!r||!id(r.id)||typeof r.text!=='string'||!validCard(r.text,g)||typeof r.hidden!=='boolean'||(r.image&&!pngTypes.test(r.image))))return false;
 }
 const validInk=(ink,char)=>Array.isArray(ink)&&ink.length<=strokesFor(char).length&&ink.every(i=>i&&typeof i.guided==='boolean'&&Array.isArray(i.points)&&i.points.length>=2&&i.points.length<=4002&&i.points.every(p=>Array.isArray(p)&&p.length===2&&p.every(v=>Number.isFinite(v)&&Math.abs(v)<10000)));
 for(const [owner,s] of Object.entries(x.sessions)){
  if(!ids.has(owner)||!s||(s.image&&!pngTypes.test(s.image))||!id(s.id)||!id(s.run)||!groupIds.includes(s.group)||typeof s.text!=='string'||!(s.group==='name'?canWrite(s.text):validCard(s.text,s.group)))return false;
  const chars=lettersOf(s.text);
  if(!Number.isInteger(s.index)||!chars[s.index]||!validInk(s.ink,chars[s.index])||!s.done||!['free','trace'].includes(s.mode)||!['easy','normal','precise'].includes(s.difficulty)||!Number.isInteger(s.attempts))return false;
  if(Object.entries(s.done).some(([i,d])=>!chars[i]||!d||!validInk(d.ink,chars[i])||!Number.isInteger(d.attempts)))return false;
 }
 for(const [l,path] of Object.entries(x.paths))if(l.length!==1||(!models[l]&&!splitSyllable(l))||!validPath(path,strokesFor(l).length))return false;
 return x.records.every(r=>r&&id(r.id)&&ids.has(r.profile)&&typeof r.text==='string'&&typeof r.letter==='string'&&typeof r.date==='string'&&Number.isFinite(Date.parse(r.date))&&['직접 쓰기','시범과 함께'].includes(r.type)&&Number.isInteger(r.attempts));
}
function backup(){
 download(new Blob([JSON.stringify({app:'sseuk-hangul',exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),'sseuk-hangul-backup.json');
}
function recordsPanel(filter=''){
 const name=id=>db.profiles.find(p=>p.id===id)?.name??'함께 연습';
 const rows=db.records.filter(r=>!filter||r.profile===filter).slice().reverse();
 $('panel').innerHTML='<h2>활동 기록</h2><label>유아 <select id="recordFilter"><option value="">모두</option><option value="guest">함께 연습</option>'+db.profiles.map(p=>'<option value="'+p.id+'">'+h(p.name)+'</option>').join('')+'</select></label><p>완료 기록 '+rows.length+'건</p><ul>'+rows.slice(0,100).map(r=>'<li><strong>'+h(name(r.profile))+'</strong>'+h(new Date(r.date).toLocaleDateString('ko-KR')+' · '+r.text+' / '+r.letter+' · '+r.type+(r.attempts?' · 다시 시도 '+r.attempts+'회':''))+'</li>').join('')+'</ul>'+(rows.length>100?'<p>최근 100건을 표시합니다. 전체 기록은 백업에 포함돼요.</p>':'')+'<h2>백업과 복원</h2><p class="sub">명단과 활동은 현재 브라우저에 저장됩니다. 다른 기기로 옮길 때는 JSON 백업을 사용하세요.</p><div class="toolbar"><button id="backup">JSON 백업</button><label>복원 파일 <input id="restore" type="file" accept=".json,application/json"></label><button id="wipe">전체 기록 초기화</button></div>';
 $('recordFilter').value=filter;$('recordFilter').onchange=e=>teacher('records',e.target.value);
 $('backup').onclick=backup;
 $('wipe').onclick=()=>{
  if(confirm('모든 유아의 활동 기록과 이어쓰기를 지울까요? 명단과 학습 카드는 유지돼요.'))commit(()=>{db.records=[];db.sessions={}},()=>teacher('records','','활동 기록을 초기화했어요.'));
 };
 let restoreSelection=0;
 $('restore').onchange=async e=>{
  const input=e.target,file=input.files[0];if(!file)return;
  document.getElementById('restoreActions')?.remove();
  const selection=++restoreSelection;
  let data;try{if(file.size>20*1024*1024)throw Error();const value=JSON.parse(await file.text());if(value.app!=='sseuk-hangul'||!validBackup(value.data))throw Error();data=value.data}catch{if(input.isConnected&&selection===restoreSelection){input.value='';feedback('이 앱에서 만든 올바른 백업 파일을 골라 주세요.')}return}
  if(!input.isConnected||!admin||selection!==restoreSelection)return;
  input.value='';
  feedback('복원 파일 확인 · 유아 '+data.profiles.length+'명 · 기록 '+data.records.length+'건');
  const actions=document.createElement('div');actions.id='restoreActions';actions.className='toolbar';actions.innerHTML='<button type="button">현재 자료 먼저 백업</button><button type="button">이 파일로 복원</button>';input.closest('.toolbar').after(actions);
  const [save,apply]=actions.querySelectorAll('button');save.onclick=backup;
  apply.onclick=()=>{
   if(!confirm('현재 자료를 선택한 백업으로 바꿀까요?'))return;
   commit(()=>{db=data;db.pin??='';if(!person())db.active='guest'},()=>{home()});
  };
 };
}
window.addEventListener('resize',()=>{if(active!==null){active=null;draft=[];paint()}});
$('muteVoice').addEventListener('click',toggleMute);
updateMuteButton();
render();
if(window.isSecureContext&&location.protocol!=='file:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
